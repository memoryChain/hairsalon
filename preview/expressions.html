<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表情方案对比 · 理发实验室</title>
<style>
@font-face{font-family:Salon;src:url('/fonts/ShuiMasterUI-Regular.ttf')}@font-face{font-family:Salon;src:url('/fonts/ShuiMasterUI-SemiBold.ttf');font-weight:600}*{box-sizing:border-box}body{margin:0;background:#eae6dc;color:#263c42;font-family:Salon,sans-serif}main{max-width:1100px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:24px;margin:0 0 8px}p{margin:5px 0;color:#617071;font-size:14px}a{color:#166d61}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 12px}button,select{font:inherit;font-size:14px;border:1px solid #d6d8ce;border-radius:9px;background:#fffdf7;color:#263c42;padding:9px 15px;cursor:pointer}button[aria-pressed=true]{background:#1b6f62;color:#fff}section{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{overflow:hidden;background:#f4f0e8;border:1px solid #d7d9cf;border-radius:16px}h2{font-size:18px;margin:17px 18px 4px}article p{margin:0 18px}canvas{display:block;width:100%;height:370px;touch-action:none;cursor:grab}footer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px}#status{margin-left:auto;font-size:13px}.note{margin-top:15px;line-height:1.7}@media(max-width:620px){main{padding:12px}h1{font-size:19px}header{align-items:flex-start}h2{font-size:15px;margin:12px}article p{font-size:12px;margin:0 12px}canvas{height:285px}section{gap:8px}button{padding:8px 11px}}
.zoom-controls{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0;pointer-events:none}.zoom-controls button{pointer-events:auto;font-size:12px;height:28px;padding:0 10px;font-weight:400}.zoom-controls span{font-size:11px;color:#617071}</style><main><header><div><h1>同一个角色，两种表情做法</h1><p>移动鼠标或按住滑动，眼睛跟随操作；角色会不定时眨眼。</p></div><a href="/">返回理发</a></header>
<nav aria-label="表情"><button data-expression="0" aria-pressed="true">平静</button><button data-expression="1" aria-pressed="false">开心</button><button data-expression="2" aria-pressed="false">惊讶</button><button data-expression="3" aria-pressed="false">生气</button><button data-expression="4" aria-pressed="false">难过哭泣</button><button id="blink">眨眼一下</button></nav>
<div class="zoom-controls" aria-label="镜头远近"><button id="zoomOut" title="拉远镜头">拉远</button><button id="zoomReset" title="恢复默认镜头距离">复位</button><button id="zoomIn" title="拉近镜头">拉近</button><span>滚轮 / 双指缩放</span></div><section><article><h2>平面五官贴图</h2><p>眼睛、眉毛、嘴巴都画在脸上</p><canvas id="flat" aria-label="平面五官三维预览"></canvas></article><article><h2>立体眼球 ＋ 贴图嘴巴</h2><p>眼球有厚度，眉毛和嘴巴用贴图</p><canvas id="hybrid" aria-label="立体眼球三维预览"></canvas></article></section>
<footer><button id="lookMode" aria-pressed="true">跟随操作</button><button id="rotateMode" aria-pressed="false">拖动旋转</button><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><label>头型 <select id="head"><option value="0">用户头型</option><option value="1">原测试头型</option></select></label><span id="status" role="status">正在加载…</span></footer>
<p class="note">这是技术对比稿，五官是占位图案。眉毛独立转动，嘴巴切换笑、哭、惊讶。左侧移动瞳孔贴图，右侧转动眼球；眨眼采用开合遮罩。正式人物仍需美术五官和眼皮适配。</p></main><script type="module" src="/expressions.js"></script></html>
