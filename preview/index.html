<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>理发大师 · 离谱造型挑战</title>
<style>
@font-face{font-family:Salon;src:url('/fonts/ShuiMasterUI-Regular.ttf')}@font-face{font-family:Salon;src:url('/fonts/ShuiMasterUI-SemiBold.ttf');font-weight:600}
*{box-sizing:border-box}body{margin:0;background:#e9e4d9;color:#263e43;font-family:Salon,system-ui,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}main,.viewport{position:relative;width:100%;height:100dvh;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
.top-controls,.bottom-controls{position:absolute;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 32px));text-align:center;pointer-events:none}.top-controls{top:max(12px,env(safe-area-inset-top))}.bottom-controls{bottom:max(14px,env(safe-area-inset-bottom))}h1{font-size:24px;margin:0 0 12px;font-weight:600}.buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;pointer-events:none}.bottom-controls .buttons{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}button{pointer-events:auto;border:1px solid #d6dfd4;border-radius:9px;height:42px;padding:0 6px;font-size:16px;font-weight:600;color:#304b48;background:#fffdf7}button[aria-pressed=true]{background:#256d60;color:white;border-color:#256d60}button:focus-visible{outline:3px solid #dc9261;outline-offset:2px}.accent{color:#a14f30}#status{font-size:11px;margin:8px 0 0;color:#78867d;font-variant-numeric:tabular-nums;white-space:normal}#hint{font-size:13px;margin:0 0 12px;color:#263e43;background:rgba(233,228,217,.94);padding:5px 2px}.rotation-zone{position:absolute;left:0;right:0;bottom:0;pointer-events:none}.rotation-zone span{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);font-size:12px;color:#6e8277;white-space:nowrap}.cursor{position:absolute;width:20px;height:20px;border:2px solid #ea8558;border-radius:50%;pointer-events:none;display:none;transform:translate(-50%,-50%)}.error{color:#a3462f!important;font-weight:600}
@media(max-width:740px){h1{font-size:20px;margin-bottom:10px}.buttons{gap:6px}button{font-size:12px;height:36px;padding:0 3px;border-radius:8px}#status{font-size:10px;line-height:1.6}#hint{font-size:11px;margin-bottom:10px}.rotation-zone span{font-size:11px;bottom:99px}.top-controls,.bottom-controls{width:calc(100% - 24px)}}
.top-controls .buttons{grid-template-columns:repeat(2,minmax(0,148px));justify-content:center}</style><link rel="stylesheet" href="/salon-flow.css"></head><body><main>
<section class="viewport"><canvas id="stage" aria-label="可旋转和剪发的三维角色"></canvas><div class="cursor" id="cursor"></div><div id="rotationZone" class="rotation-zone"></div></section>
<header class="top-controls"><h1 id="styleTitle">载入发型…</h1><div class="buttons"><button id="previousStyle">上一款</button><button id="nextStyle">下一款</button></div><p id="status" role="status">正在准备原型…</p></header>
<footer class="bottom-controls" hidden><p id="hint">滑动可连续剪发；头下方空白区域拖动旋转。</p><div class="buttons"><button id="cut" aria-pressed="true">剪发</button><button id="comb" aria-pressed="false">梳理</button><button id="blow" aria-pressed="false">吹风</button><button id="shave" aria-pressed="false">剃光</button><button id="inspect" aria-pressed="false">查看头皮</button><button id="reset" class="accent">恢复发型</button></div></footer>
</main><script type="module" src="/viewer.js"></script></body></html>
